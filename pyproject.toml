[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ida-forge"
version = "0.0.1"
description = "IDA Pro plugin for recovering C structure layouts from decompiler output"
requires-python = ">=3.9"
dependencies = ["toml>=0.10"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
ida = ["ida-domain>=0.5.1"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 120
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
# E/F/I core correctness, UP/B modern idioms, SIM/BLE/PL readability,
# FA/PIE/TRY/RET/C4/RUF/S hygiene. Deliberate exceptions carry per-line
# `noqa` comments with reasons; class-level ignores are reasoned below.
select = [
    "E", "F", "I", "UP", "B", "SIM", "BLE", "PL", "RUF", "FA", "PIE",
    "TRY", "RET", "C4", "S",
]
ignore = [
    "E501",    # line length is not enforced project-wide (no formatter)
    "S101",    # assert is the idiomatic test assertion and a runtime guard here
    "PLR2004", # hex constants (EAs/byte offsets) are legitimately magic
    "PLR0911", # complexity metrics are tracked as refactor debt, not lint gates
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR0917",
    "PLC0415", # lazy IDA-API imports inside functions keep plugin startup lean
    "F403",    # deliberate `from forge.api.hexrays import *`; removed by I.4
    "F405",
    "TRY003",  # raise-vanilla-args noise; TRY002 (wrong exception class) stays
    "TRY300",  # try-consider-else is a style preference
    "RET503",  # implicit-return None is idiomatic in visitor callbacks
    "PLW0108", # unnecessary-lambda is a refactor-opportunity rule, not a bug
    "RUF100",  # legacy line-specific noqas may target disabled rules
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "E402", "I001", "SIM117", "RUF002", "RUF003", "RUF017", "RUF012",
    "F811", "F841", "F821", "PLE0302", "PLE0303", "PLE0304", "PLE0305",
    "PIE807", "TRY203", "B904", "S102",
]
"src/forge/api/members.py" = ["E402", "BLE001", "SIM105", "S110", "RUF023"]
"src/forge/api/store.py" = ["TRY301", "I001"]
"src/forge/util/qt.py" = ["S110"]
"src/forge_api.py" = ["BLE001", "RUF003", "TRY301", "S110", "S112", "S324", "TRY004", "PLW2901", "SIM102", "F841", "I001", "RUF022", "B033"]
"src/forge/api/scanner.py" = ["E402", "F811"]
"src/forge/api/scan_object.py" = ["F401"]
"src/forge/api/storage.py" = ["RUF022", "PIE790"]
"src/forge/api/provenance.py" = ["TRY004"]
"src/forge/api/scan_subobject.py" = ["TRY004"]
"tests/unit/test_forge_api.py" = ["F401", "RET501", "PLR1711", "PLR0402"]
