name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" ruff
      # compileall also names scripts/, but scripts/* is gitignored (only
      # r3_gap_probe.py is tracked), so it effectively gates src + tests.
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: python -m pytest